<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Figure 1. Construct and evidence map</title><desc id="desc">WHU evidence status across six non-interchangeable questions</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>.t{font:700 27px system-ui;fill:#17202a}.s{font:15px system-ui;fill:#566573}.h{font:700 16px system-ui;fill:#17202a}.b{font:14px system-ui;fill:#283747}.n{font:700 20px system-ui;fill:#17202a}.small{font:12px system-ui;fill:#566573}.box{fill:#fff;stroke:#839192;stroke-width:1.5;rx:10}.ok{fill:#d5f5e3}.mix{fill:#fcf3cf}.fail{fill:#fadbd8}.method{fill:#e8daef}.none{fill:#eaecee}</style>
<text class="t" x="48" y="48">Figure 1. Construct and evidence map</text><text class="s" x="48" y="76">WHU evidence status across six non-interchangeable questions</text><rect class="ok" x="60" y="125" width="330" height="145" rx="10"/><text class="h" x="80" y="168" text-anchor="start">1. Supplied-evidence reasoning</text><text class="b" x="80" y="207" text-anchor="start">tested positive / mixed</text><rect class="fail" x="440" y="125" width="330" height="145" rx="10"/><text class="h" x="460" y="168" text-anchor="start">2. Acquisition adequacy</text><text class="b" x="460" y="207" text-anchor="start">tested; frozen gate failed</text><rect class="mix" x="820" y="125" width="330" height="145" rx="10"/><text class="h" x="840" y="168" text-anchor="start">3. Acquisition assurance</text><text class="b" x="840" y="207" text-anchor="start">bounded synthetic results</text><rect class="none" x="60" y="345" width="330" height="145" rx="10"/><text class="h" x="80" y="388" text-anchor="start">4. System composition</text><text class="b" x="80" y="427" text-anchor="start">not established</text><rect class="method" x="440" y="345" width="330" height="145" rx="10"/><text class="h" x="460" y="388" text-anchor="start">5. Economics</text><text class="b" x="460" y="427" text-anchor="start">untested scenario hypothesis</text><rect class="none" x="820" y="345" width="330" height="145" rx="10"/><text class="h" x="840" y="388" text-anchor="start">6. User decision policy</text><text class="b" x="840" y="427" text-anchor="start">not established</text><text class="small" x="600" y="590" text-anchor="middle">Distinct evidentiary questions; adjacent placement does not identify causation.</text></svg>