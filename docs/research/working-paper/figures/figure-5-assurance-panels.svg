<text class="t" x="48" y="48">Figure 5. Assurance risk and coverage</text><text class="s" x="48" y="76">Observed descriptive fractions, not production rates or confidence bounds</text><rect class="box" x="45" y="105" width="540" height="500" rx="10"/><text class="h" x="65" y="140" text-anchor="start">Panel A — V3 holdout (n=240; Y=1: 93, 38.75%)</text><text class="small" x="65" y="166" text-anchor="start">No outcome/reliability pass threshold was prespecified</text><text class="small" x="70" y="210" text-anchor="start">B_SOURCE_COUNT</text><text class="b" x="300" y="210" text-anchor="start">coverage 37.92%</text><text class="b" x="470" y="210" text-anchor="middle">FA 34/91 (37.36%)</text><text class="small" x="70" y="277" text-anchor="start">B_BUDGET</text><text class="b" x="300" y="277" text-anchor="start">coverage 99.58%</text><text class="b" x="470" y="277" text-anchor="middle">FA 93/239 (38.91%)</text><text class="small" x="70" y="344" text-anchor="start">B_RECENT_YIELD</text><text class="b" x="300" y="344" text-anchor="start">coverage 7.08%</text><text class="b" x="470" y="344" text-anchor="middle">FA 5/17 (29.41%)</text><text class="small" x="70" y="411" text-anchor="start">C_DECISION_TABLE</text><text class="b" x="300" y="411" text-anchor="start">coverage 11.25%</text><text class="b" x="470" y="411" text-anchor="middle">FA 7/27 (25.93%)</text><text class="small" x="70" y="478" text-anchor="start">C_LOGISTIC</text><text class="b" x="300" y="478" text-anchor="start">coverage 79.58%</text><text class="b" x="470" y="478" text-anchor="middle">FA 68/191 (35.60%)</text><rect class="box" x="615" y="105" width="540" height="500" rx="10"/><text class="h" x="635" y="140" text-anchor="start">Panel B — V2 calibration (n=1,294; Y=1: 588, 45.44%)</text><text class="small" x="635" y="166" text-anchor="start">Frozen absolute false-assurance maximum: 15%</text><text class="small" x="640" y="220" text-anchor="start">Convergence rule</text><text class="b" x="840" y="220" text-anchor="start">coverage 21.72%</text><text class="b" x="1030" y="220" text-anchor="middle">FA 87/281 (30.96%)</text><text class="small" x="640" y="302" text-anchor="start">COVERAGE_STOPPING</text><text class="b" x="840" y="302" text-anchor="start">coverage 87.64%</text><text class="b" x="1030" y="302" text-anchor="middle">FA 520/1134 (45.86%)</text><text class="small" x="640" y="384" text-anchor="start">MARGINAL_YIELD</text><text class="b" x="840" y="384" text-anchor="start">coverage 22.87%</text><text class="b" x="1030" y="384" text-anchor="middle">FA 130/296 (43.92%)</text><text class="small" x="640" y="466" text-anchor="start">SEARCH_VOLUME</text><text class="b" x="840" y="466" text-anchor="start">coverage 95.36%</text><text class="b" x="1030" y="466" text-anchor="middle">FA 560/1234 (45.38%)</text><text class="small" x="600" y="630" text-anchor="middle">V2 withheld-set composition: 512/1,013 adequate (50.54%); V3-aligned false withholding: 512/706 (72.52%)</text><text class="h" x="600" y="655" text-anchor="middle">DIFFERENT SYNTHETIC DISTRIBUTIONS — NO CROSS-PANEL COMPARISON OR POOLING</text></svg>