<text class="t" x="48" y="48">Figure 6. Measurement-failure taxonomy</text><text class="s" x="48" y="76">Examples from WHU; no claim about frequency outside this program</text><rect class="method" x="55" y="105" width="520" height="92" rx="10"/><text class="h" x="73" y="139" text-anchor="start">Reconstructability</text><text class="small" x="73" y="170" text-anchor="start">historical replay; authentic state unavailable</text><rect class="method" x="620" y="105" width="520" height="92" rx="10"/><text class="h" x="638" y="139" text-anchor="start">Provider compatibility</text><text class="small" x="638" y="170" text-anchor="start">Fable HTTP 400; milestone invalid</text><rect class="method" x="55" y="230" width="520" height="92" rx="10"/><text class="h" x="73" y="264" text-anchor="start">Hidden-oracle leakage</text><text class="small" x="73" y="295" text-anchor="start">claim-changing closure</text><rect class="method" x="620" y="230" width="520" height="92" rx="10"/><text class="h" x="638" y="264" text-anchor="start">Underdetermined specification</text><text class="small" x="638" y="295" text-anchor="start">assurance execution</text><rect class="method" x="55" y="355" width="520" height="92" rx="10"/><text class="h" x="73" y="389" text-anchor="start">Impossible perturbation</text><text class="small" x="73" y="420" text-anchor="start">executable successor</text><rect class="method" x="620" y="355" width="520" height="92" rx="10"/><text class="h" x="638" y="389" text-anchor="start">Nonconstructible denominator</text><text class="small" x="638" y="420" text-anchor="start">prospective revision</text><rect class="method" x="55" y="480" width="520" height="92" rx="10"/><text class="h" x="73" y="514" text-anchor="start">Trivial exhaustion</text><text class="small" x="73" y="545" text-anchor="start">convergence V1</text><rect class="method" x="620" y="480" width="520" height="92" rx="10"/><text class="h" x="638" y="514" text-anchor="start">Missing evaluation denominator</text><text class="small" x="638" y="545" text-anchor="start">B2A-v2</text><text class="small" x="600" y="640" text-anchor="middle">These episodes are methodological history, not capability evidence or empirical performance denominators.</text></svg>