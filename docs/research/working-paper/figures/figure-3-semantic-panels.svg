<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Figure 3. Bounded supplied-evidence results</title><desc id="desc">Separate panels; deterministic synthetic tasks; mostly one run</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>.t{font:700 27px system-ui;fill:#17202a}.s{font:15px system-ui;fill:#566573}.h{font:700 16px system-ui;fill:#17202a}.b{font:14px system-ui;fill:#283747}.n{font:700 20px system-ui;fill:#17202a}.small{font:12px system-ui;fill:#566573}.box{fill:#fff;stroke:#839192;stroke-width:1.5;rx:10}.ok{fill:#d5f5e3}.mix{fill:#fcf3cf}.fail{fill:#fadbd8}.method{fill:#e8daef}.none{fill:#eaecee}</style>
<text class="t" x="48" y="48">Figure 3. Bounded supplied-evidence results</text><text class="s" x="48" y="76">Separate panels; deterministic synthetic tasks; mostly one run</text><rect class="ok" x="55" y="110" width="520" height="120" rx="10"/><text class="h" x="73" y="144" text-anchor="start">Stage A</text><text class="n" x="73" y="179" text-anchor="start">10/10 exact</text><text class="small" x="73" y="208" text-anchor="start">0/10 overshoot</text><rect class="fail" x="620" y="110" width="520" height="120" rx="10"/><text class="h" x="638" y="144" text-anchor="start">Stage B / C</text><text class="n" x="638" y="179" text-anchor="start">6/10 vs 10/10 exact</text><text class="small" x="638" y="208" text-anchor="start">0 overshoots in both; frozen gate failed</text><rect class="ok" x="55" y="275" width="520" height="120" rx="10"/><text class="h" x="73" y="309" text-anchor="start">Known gap</text><text class="n" x="73" y="344" text-anchor="start">5/5 exact</text><text class="small" x="73" y="373" text-anchor="start">consequentiality sensitivity passed</text><rect class="mix" x="620" y="275" width="520" height="120" rx="10"/><text class="h" x="638" y="309" text-anchor="start">Falsifier</text><text class="n" x="638" y="344" text-anchor="start">9/10 true minima</text><text class="small" x="638" y="373" text-anchor="start">0 false; one equal minimum missed</text><rect class="method" x="55" y="440" width="1090" height="120" rx="10"/><text class="h" x="73" y="474" text-anchor="start">Astra inset</text><text class="n" x="73" y="509" text-anchor="start">15/15 calibration; 10/10 falsifiers</text><text class="small" x="73" y="538" text-anchor="start">descriptive only; milestone invalid</text><text class="small" x="600" y="650" text-anchor="middle">Panels use different task families and denominators. No combined accuracy or model ranking is defined.</text></svg>