<title id="title">Figure 2. Prospectively governed study chronology</title><desc id="desc">Status and custody, not a performance ranking</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>.t{font:700 27px system-ui;fill:#17202a}.s{font:15px system-ui;fill:#566573}.h{font:700 16px system-ui;fill:#17202a}.b{font:14px system-ui;fill:#283747}.n{font:700 20px system-ui;fill:#17202a}.small{font:12px system-ui;fill:#566573}.box{fill:#fff;stroke:#839192;stroke-width:1.5;rx:10}.ok{fill:#d5f5e3}.mix{fill:#fcf3cf}.fail{fill:#fadbd8}.method{fill:#e8daef}.none{fill:#eaecee}</style>
<text class="t" x="48" y="48">Figure 2. Prospectively governed study chronology</text><text class="s" x="48" y="76">Status and custody, not a performance ranking</text><rect class="ok" x="45" y="105" width="540" height="66" rx="10"/><text class="h" x="59" y="129" text-anchor="start">Stage A</text><text class="small" x="59" y="153" text-anchor="start">STAGE_A_CLAIM_CALIBRATION_GATE_PASSED</text><rect class="fail" x="625" y="105" width="540" height="66" rx="10"/><text class="h" x="639" y="129" text-anchor="start">Stage B/C</text><text class="small" x="639" y="153" text-anchor="start">STAGE_BC_GAP_DISCLOSURE_GATE_FAILED</text><rect class="ok" x="45" y="191" width="540" height="66" rx="10"/><text class="h" x="59" y="215" text-anchor="start">Known gap / falsifier</text><text class="small" x="59" y="239" text-anchor="start">VALID BOUNDED RESULTS</text><rect class="method" x="625" y="191" width="540" height="66" rx="10"/><text class="h" x="639" y="215" text-anchor="start">Cross-model</text><text class="small" x="639" y="239" text-anchor="start">CROSS_MODEL_SEMANTIC_REPLICATION_INVALID</text><rect class="fail" x="45" y="277" width="540" height="66" rx="10"/><text class="h" x="59" y="301" text-anchor="start">Acquisition V1.4</text><text class="small" x="59" y="325" text-anchor="start">ACQUISITION_EXPERIMENT_COMPLETE__PRIMARY_GATE_FAILED</text><rect class="method" x="625" y="277" width="540" height="66" rx="10"/><text class="h" x="639" y="301" text-anchor="start">Claim-changing closure</text><text class="small" x="639" y="325" text-anchor="start">CLAIM_CHANGING_CLOSURE_CONCEPT_NOT_OPERATIONALIZED</text><rect class="method" x="45" y="363" width="540" height="66" rx="10"/><text class="h" x="59" y="387" text-anchor="start">Assurance execution</text><text class="small" x="59" y="411" text-anchor="start">OWNER_BLOCKER__FROZEN_EXECUTION_SPECIFICATION_NOT_DETERMINATE</text><rect class="method" x="625" y="363" width="540" height="66" rx="10"/><text class="h" x="639" y="387" text-anchor="start">Executable successor</text><text class="small" x="639" y="411" text-anchor="start">OWNER_BLOCKER__FROZEN_MATCHED_PERTURBATION_IMPOSSIBLE</text><rect class="method" x="45" y="449" width="540" height="66" rx="10"/><text class="h" x="59" y="473" text-anchor="start">Prospective revision</text><text class="small" x="59" y="497" text-anchor="start">OWNER_BLOCKER__REVISED_DESIGN_DENOMINATORS_NOT_CONSTRUCTIBLE</text><rect class="mix" x="625" y="449" width="540" height="66" rx="10"/><text class="h" x="639" y="473" text-anchor="start">V3 holdout</text><text class="small" x="639" y="497" text-anchor="start">SYNTHETIC_STOPPING_SIGNALS_SHOW_BOUNDED_PREDICTIVE_UTILITY; CONSUMED_ONCE</text><rect class="method" x="45" y="535" width="540" height="66" rx="10"/><text class="h" x="59" y="559" text-anchor="start">Convergence V1</text><text class="small" x="59" y="583" text-anchor="start">OWNER_BLOCKER__CONVERGENCE_DESIGN_FAILS_NON_EXHAUSTION_SATISFIABILITY</text><rect class="fail" x="625" y="535" width="540" height="66" rx="10"/><text class="h" x="639" y="559" text-anchor="start">Convergence V2</text><text class="small" x="639" y="583" text-anchor="start">CONVERGENCE_V2_CALIBRATION_GATE_FAILED__HOLDOUT_UNOPENED</text><text class="small" x="600" y="650" text-anchor="middle">Purple = invalid/stopped methodological history; red = executed result with failed prospective gate.</text></svg>