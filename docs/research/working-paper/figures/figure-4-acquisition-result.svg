<text class="t" x="48" y="48">Figure 4. Exact conclusions coexisted with a failed acquisition gate</text><text class="s" x="48" y="76">One valid four-case Luna run; specialized closed-universe interface</text><rect class="ok" x="60" y="120" width="510" height="390" rx="10"/><text class="h" x="85" y="160" text-anchor="start">Terminal-output metrics</text><text class="n" x="90" y="205" text-anchor="start">4/4 exact final claims</text><text class="n" x="90" y="252" text-anchor="start">4/4 exact adequacy</text><text class="n" x="90" y="299" text-anchor="start">4/4 exact known gaps</text><text class="b" x="90" y="346" text-anchor="start">0 overshoots</text><text class="b" x="90" y="393" text-anchor="start">0 premature stops</text><text class="b" x="90" y="440" text-anchor="start">0 over-searching</text><rect class="fail" x="630" y="120" width="510" height="390" rx="10"/><text class="h" x="655" y="160" text-anchor="start">Frozen acquisition gate</text><text class="n" x="660" y="215" text-anchor="start">Recall 0.875</text><text class="n" x="660" y="280" text-anchor="start">Irrelevant burden 0.5458</text><text class="n" x="660" y="345" text-anchor="start">Directed metric 0/4</text><text class="n" x="660" y="410" text-anchor="start">PRIMARY GATE FAILED</text><rect class="mix" x="180" y="545" width="840" height="88" rx="10"/><text class="h" x="205" y="580" text-anchor="start">Forensic narrowing</text><text class="small" x="205" y="608" text-anchor="start">Two missed positives did not change the affected terminal claim bands; hidden intent/basis affected the directed metric.</text></svg>